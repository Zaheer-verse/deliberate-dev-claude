name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan all fetched history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-ci.toml"
          : > "$RUNNER_TEMP/gitleaks-empty.ignore"
          # Gitleaks also reads this file implicitly; discard it only in this CI checkout.
          rm -f -- "$GITHUB_WORKSPACE/.gitleaksignore"
          "$RUNNER_TEMP/gitleaks" git "$GITHUB_WORKSPACE" \
            --config "$RUNNER_TEMP/gitleaks-ci.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty.ignore" \
            --ignore-gitleaks-allow \
            --log-opts='--all --full-history --diff-merges=separate' \
            --redact=100 --no-banner

      - name: Scan tracked worktree files and archives with redacted output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir "$GITHUB_WORKSPACE" \
            --config "$RUNNER_TEMP/gitleaks-ci.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty.ignore" \
            --ignore-gitleaks-allow \
            --max-archive-depth=2 --max-decode-depth=5 \
            --redact=100 --no-banner
