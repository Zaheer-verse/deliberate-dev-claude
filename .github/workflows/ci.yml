name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavioral, integration, and package checks
        run: python -m unittest discover -s tests -v
      - name: Validate example plan
        run: python scripts/workflow.py check examples/plan.json --stage plan
  manifest:
    name: Claude plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.266
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/marketplace.json
